<title>Stained-Glass Hibiscus Earrings</title>
<meta name="description" content="A pair of stained-glass hibiscus drop earrings rendered in real-time 3D.">
<style>
  /* One dark studio stage: the earrings are the page. */
  :root {
    --ground: #131214;
    --ink: #e9dccb;
    --ink-dim: rgba(233, 220, 203, 0.55);
    --gold: #c9a463;
    --chip: rgba(30, 27, 28, 0.72);
    --chip-line: rgba(201, 164, 99, 0.35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.45) 100%); }
  .caption { position: fixed; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); pointer-events: none;
    display: grid; gap: 4px; max-width: calc(100% - 150px); }
  .caption .name { font: italic 400 15px/1.2 var(--serif); letter-spacing: 0.01em; color: var(--ink); }
  .caption .hint { font: 500 10.5px/1.3 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
  #pause { position: fixed; right: 18px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
    font: 500 11px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: border-color .2s, background .2s; }
  #pause:hover { border-color: var(--gold); }
  #pause:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #pause .ico svg { width: 11px; height: 11px; fill: var(--gold); display: block; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: italic 14px var(--serif); color: var(--ink-dim); transition: opacity .6s; }
  .ready .loading { opacity: 0; }
  @media (max-width: 480px) { .caption .hint { display: none; } }
</style>
<div id="stage"></div>
<div class="vignette"></div>
<div class="loading">Leading the glass…</div>
<div class="caption">
  <span class="name">Stained-glass hibiscus drops</span>
  <span class="hint">Drag to orbit · Scroll to zoom</span>
</div>
<button id="pause" type="button" aria-pressed="false"><span class="ico"></span><span class="label">Pause</span></button>
<script>/*BUNDLE*/</script>
